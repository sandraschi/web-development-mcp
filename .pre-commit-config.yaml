# Pre-commit config (fleet template: Ruff + Biome local hook + hygiene).
# Install with: uv run pre-commit install   (or: just bootstrap)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: biome-ci
        name: biome ci (changed web files)
        entry: powershell.exe -NoProfile -File scripts/pre-commit-biome.ps1
        language: system
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
