# Docker Compose configuration for Web Development MCP
# Supports development, testing, and production deployments

version: '3.8'

services:
  # =============================================================================
  # Development service - with hot reload and debugging
  # =============================================================================
  web-development-mcp-dev:
    build:
      context: .
      target: development
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-dev}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")}
    container_name: web-development-mcp-dev
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # For GUI access (optional)
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - MCP_DEBUG=true
      - Web Development_PATH=/opt/Web Development/Web Development
      - DISPLAY=${DISPLAY:-:0}  # For GUI access
    ports:
      - "8000:8000"  # HTTP mode
    stdin_open: true
    tty: true
    command: ["python", "-m", "web_development_mcp.cli", "--http", "--host", "0.0.0.0", "--debug"]
    healthcheck:
      test: ["CMD", "python", "-c", "import web_development_mcp; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcp-network
    profiles:
      - dev

  # =============================================================================
  # Production service - optimized for performance
  # =============================================================================
  web-development-mcp:
    build:
      context: .
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-latest}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")}
    container_name: web-development-mcp
    environment:
      - MCP_ENV=production
      - Web Development_PATH=/opt/Web Development/Web Development
    ports:
      - "8001:8000"  # HTTP mode on different port
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import web_development_mcp; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcp-network
    profiles:
      - prod

  # =============================================================================
  # Testing service - for CI/CD pipelines
  # =============================================================================
  web-development-mcp-test:
    build:
      context: .
      target: development
    container_name: web-development-mcp-test
    environment:
      - PYTHONPATH=/app/src
      - MCP_ENV=test
      - Web Development_PATH=/opt/Web Development/Web Development
    volumes:
      - .:/app
    command: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    networks:
      - mcp-network
    profiles:
      - test

  # =============================================================================
  # Minimal runtime service - for registry-style deployments
  # =============================================================================
  web-development-mcp-runtime:
    build:
      context: .
      target: runtime
    container_name: web-development-mcp-runtime
    environment:
      - MCP_ENV=runtime
      - Web Development_PATH=/opt/Web Development/Web Development
    ports:
      - "8002:8000"
    networks:
      - mcp-network
    profiles:
      - runtime

# =============================================================================
# Networks
# =============================================================================
networks:
  mcp-network:
    driver: bridge
    name: web-development-mcp-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  Web Development-cache:
    driver: local
    name: web-development-mcp-cache






