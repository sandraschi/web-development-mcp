[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-development-mcp"
version = "1.0.0"
description = "Universal web development operations MCP server supporting modern frontend frameworks and tooling"
authors = [
    {name = "Sandra", email = "sandra@example.com"}
]
dependencies = [
    "fastmcp>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[project.scripts]
web-development-mcp = "web_development_mcp:mcp"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
