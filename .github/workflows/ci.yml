name: CI
on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/web_development_mcp/

      - name: Black format check
        run: black --check src/web_development_mcp/

      - name: Mypy type check
        run: mypy src/web_development_mcp/ --ignore-missing-imports

      - name: Pytest
        run: pytest tests/ -v --tb=short
